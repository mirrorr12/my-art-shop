<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>α ART GALLERY | 原創唐卡藝術微噴</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", sans-serif;
    }

    body {
      background-color: #fafafa;
      color: #222;
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 8%;
      background-color: #fff;
      border-bottom: 1px solid #eee;
    }

    .logo {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: #666;
      font-size: 14px;
    }

    /* 商品主區域 */
    .product-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
    }

    /* 左側圖庫展示 */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .main-image-box {
      width: 100%;
      height: 480px;
      background-color: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 6px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 10px;
    }

    .main-image-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      transition: opacity 0.2s ease;
    }

    .thumb-list {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .thumb-item {
      width: 60px;
      height: 60px;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      object-fit: cover;
      opacity: 0.6;
      transition: all 0.2s;
    }

    .thumb-item:hover, .thumb-item.active {
      opacity: 1;
      border-color: #000;
    }

    /* 右側資訊區 */
    .product-info {
      display: flex;
      flex-direction: column;
    }

    .product-title {
      font-size: 28px;
      font-weight: 500;
      margin-bottom: 12px;
    }

    .price-bar {
      margin-bottom: 25px;
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .original-price {
      text-decoration: line-through;
      color: #999;
      font-size: 16px;
    }

    .current-price {
      font-size: 24px;
      font-weight: 600;
      color: #111;
    }

    .sale-tag {
      background-color: #efefef;
      padding: 2px 8px;
      font-size: 12px;
      border-radius: 3px;
      color: #555;
    }

    /* 選項區塊 */
    .option-title {
      font-size: 14px;
      color: #555;
      margin-bottom: 10px;
    }

    .frame-options {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 15px;
    }

    .frame-btn {
      padding: 12px;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      text-align: center;
      transition: all 0.2s;
    }

    .frame-btn:hover {
      border-color: #666;
    }

    .frame-btn.selected {
      background-color: #1a1a1a;
      color: #fff;
      border-color: #1a1a1a;
    }

    /* 數量選擇器 */
    .qty-box {
      display: flex;
      align-items: center;
      border: 1px solid #ccc;
      width: fit-content;
      border-radius: 4px;
      margin-bottom: 30px;
      background: #fff;
    }

    .qty-btn {
      width: 38px;
      height: 38px;
      background: none;
      border: none;
      font-size: 18px;
      cursor: pointer;
      user-select: none;
    }

    .qty-btn:active {
      background-color: #eee;
    }

    .qty-input {
      width: 45px;
      text-align: center;
      border: none;
      font-size: 15px;
      outline: none;
    }

    /* 結帳按鈕 */
    .checkout-btn {
      width: 100%;
      padding: 16px;
      border: 1px solid #1a1a1a;
      background-color: #1a1a1a;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      letter-spacing: 1px;
      border-radius: 4px;
      transition: background-color 0.2s;
    }

    .checkout-btn:hover {
      background-color: #333;
    }

    @media (max-width: 768px) {
      .product-container {
        grid-template-columns: 1fr;
        gap: 30px;
      }
      .frame-options {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">α ART GALLERY</div>
    <nav>
      <a href="#">首頁</a>
      <a href="#">唐卡典藏</a>
      <a href="#">關於藝術家</a>
    </nav>
  </header>

  <main class="product-container">
    
    <!-- 左側圖片區 -->
    <div class="gallery-container">
      <div class="main-image-box">
        <img id="mainImage" src="FourArmedGuanyin.jpg" alt="主圖">
      </div>
      <div class="thumb-list">
        <img class="thumb-item active" src="FourArmedGuanyin.jpg" onclick="changeImage(this)">
        <img class="thumb-item" src="FourArmedGuanyinDetail.jpg" onclick="changeImage(this)">
      </div>
    </div>

    <!-- 右側資訊區 -->
    <div class="product-info">
      <h1 class="product-title">四臂觀音唐卡(高精細微噴)</h1>
      
      <div class="price-bar">
        <span class="original-price">NT$12,000</span>
        <span class="current-price" id="totalPriceDisplay">NT$ 8,800 TWD</span>
        <span class="sale-tag">特價優惠中</span>
      </div>

      <!-- 規格選單 -->
      <div class="option-title">規格：<strong id="selectedFrameName" style="color:#000;">畫芯</strong></div>
      <div class="frame-options">
        <button class="frame-btn selected" onclick="onFrameSelect(this, '畫芯', 8800, '【畫芯】僅提供高精細藝術微噴畫芯，適合自行尋找框藝或捲軸裝裱。')">畫芯</button>
        <button class="frame-btn" onclick="onFrameSelect(this, '傳統藏式裝裱', 12800, '【傳統藏式裝裱】採用傳統絹織布藝手藝裝裱，具備藏式掛軸質感，可直接掛於佛堂或空間。')">傳統藏式裝裱</button>
      </div>

      <!-- 規格動態介紹區 -->
      <div id="optionDescription" style="font-size: 13px; color: #666; background: #f5f5f5; padding: 12px; border-radius: 4px; margin-bottom: 25px; line-height: 1.5;">
        【畫芯】僅提供高精細藝術微噴畫芯，適合自行尋找框藝或捲軸裝裱。
      </div>

      <!-- 數量調整 -->
      <div class="option-title">購買數量</div>
      <div class="qty-box">
        <button class="qty-btn" onclick="changeQuantity(-1)">-</button>
        <input type="text" class="qty-input" id="qtyInput" value="1" readonly>
        <button class="qty-btn" onclick="changeQuantity(1)">+</button>
      </div>

      <!-- 下單按鈕 -->
      <button class="checkout-btn" onclick="goToCheckout()">加入購物車 / 立即結帳</button>
    </div>

  </main>

  <script>
    // 預設選擇【畫芯】對應金額 8800
    let basePrice = 8800;
    let currentQty = 1;

    // 1. 縮圖切換
    function changeImage(element) {
      document.querySelectorAll('.thumb-item').forEach(img => img.classList.remove('active'));
      element.classList.add('active');
      document.getElementById('mainImage').src = element.src;
    }

    // 2. 規格切換（含說明文字與金額更新）
    function onFrameSelect(buttonElement, frameName, price, description) {
      document.querySelectorAll('.frame-btn').forEach(btn => btn.classList.remove('selected'));
      buttonElement.classList.add('selected');
      
      document.getElementById('selectedFrameName').innerText = frameName;
      document.getElementById('optionDescription').innerText = description;
      
      basePrice = price;
      calculateTotal();
    }

    // 3. 數量加減
    function changeQuantity(delta) {
      currentQty += delta;
      if (currentQty < 1) currentQty = 1;
      document.getElementById('qtyInput').value = currentQty;
      calculateTotal();
    }

    // 4. 即時計算金額
    function calculateTotal() {
      const total = basePrice * currentQty;
      document.getElementById('totalPriceDisplay').innerText = `NT$ ${total.toLocaleString()} TWD`;
    }

    // 5. 跳轉賣貨便
    function goToCheckout() {
      const selectedFrame = document.getElementById('selectedFrameName').innerText;
      const myPaymentUrl = "https://myship.7-11.com.tw/general/detail/GM2608033942142"; 
      
      alert(`已為您選擇：【${selectedFrame}】 x ${currentQty} 件\n即將為您導向安全的結帳頁面！`);
      window.location.href = myPaymentUrl;
    }
  </script>

</body>
</html>
